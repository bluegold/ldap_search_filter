implementations:
  - name: ruby
    command:
      - ruby
      - ruby/ldap_filter.rb
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: typescript
    build: &typescript_build
      cwd: typescript
      target: dist/index.js
      sources:
        - src/**/*.ts
        - package.json
        - tsconfig.json
      command:
        - tsc
        - -p
        - tsconfig.json
    command:
      - node
      - typescript/dist/index.js
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: typescript-bun
    build: *typescript_build
    command:
      - bun
      - typescript/dist/index.js
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: csharp
    build:
      cwd: csharp
      target: bin/Release/net10.0/LdapFilter.dll
      sources:
        - "*.csproj"
        - Program.cs
      command:
        - env
        - DOTNET_CLI_HOME=/tmp/ldf-dotnet
        - DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
        - DOTNET_NOLOGO=1
        - dotnet
        - build
        - -c
        - Release
    command:
      - env
      - DOTNET_CLI_HOME=/tmp/ldf-dotnet
      - DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
      - DOTNET_NOLOGO=1
      - dotnet
      - csharp/bin/Release/net10.0/LdapFilter.dll
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: csharp-aot
    build:
      cwd: csharp-aot
      target: bin/Release/net10.0/linux-x64/publish/LdapFilter.Aot
      size_target: bin/Release/net10.0/linux-x64/publish
      sources:
        - LdapFilter.Aot.csproj
        - ../csharp/Program.cs
      command:
        - env
        - DOTNET_CLI_HOME=/tmp/ldf-dotnet
        - DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
        - DOTNET_NOLOGO=1
        - dotnet
        - publish
        - LdapFilter.Aot.csproj
        - -c
        - Release
        - -r
        - linux-x64
        - -p:PublishAot=true
        - -p:SelfContained=true
    command:
      - csharp-aot/bin/Release/net10.0/linux-x64/publish/LdapFilter.Aot
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: zig
    build:
      cwd: zig
      target: zig-out/bin/ldap_filter
      sources:
        - build.zig
        - src/**/*.zig
      command:
        - env
        - ZIG_GLOBAL_CACHE_DIR=/tmp/ldf-zig-cache
        - ZIG_LOCAL_CACHE_DIR=/tmp/ldf-zig-cache-local
        - zig
        - build
        - -Doptimize=ReleaseFast
    command:
      - env
      - ZIG_GLOBAL_CACHE_DIR=/tmp/ldf-zig-cache
      - ZIG_LOCAL_CACHE_DIR=/tmp/ldf-zig-cache-local
      - zig/zig-out/bin/ldap_filter
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: rust
    build:
      cwd: rust
      target: target/release/ldf
      sources:
        - Cargo.toml
        - Cargo.lock
        - src/**/*.rs
      command:
        - cargo
        - build
        - --release
        - --locked
    command:
      - rust/target/release/ldf
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: go
    build:
      cwd: go
      target: bin/ldap_filter
      sources:
        - "*.go"
        - go.mod
      command:
        - env
        - GOCACHE=/tmp/ldf-gocache
        - go
        - build
        - -o
        - bin/ldap_filter
        - .
    command:
      - go/bin/ldap_filter
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: go-switch
    build:
      cwd: go-switch
      target: bin/ldap_filter
      sources:
        - "*.go"
        - go.mod
      command:
        - env
        - GOCACHE=/tmp/ldf-gocache
        - go
        - build
        - -o
        - bin/ldap_filter
        - .
    command:
      - go-switch/bin/ldap_filter
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: python
    command:
      - python3
      - python/ldap_filter.py
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: python-pyc
    build:
      cwd: python
      target: __pycache__
      sources:
        - ldap_filter.py
      command:
        - python3
        - -m
        - py_compile
        - ldap_filter.py
    command:
      - python3
      - python/ldap_filter.py
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: cpp
    build:
      cwd: cpp
      target: ldap_filter
      sources:
        - "*.cpp"
        - "*.hpp"
      command:
        - g++
        - -std=c++20
        - -O3
        - -pipe
        - -o
        - ldap_filter
        - main.cpp
    command:
      - cpp/ldap_filter
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: php
    command:
      - php
      - php/ldap_filter.php
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: sbcl
    build:
      cwd: sbcl
      target: ldap_filter
      sources:
        - ldap_filter.lisp
      command:
        - sbcl
        - --noinform
        - --non-interactive
        - --load
        - ldap_filter.lisp
        - --eval
        - "(sb-ext:save-lisp-and-die \"ldap_filter\" :toplevel #'main :executable t :save-runtime-options t)"
    command:
      - sbcl/ldap_filter
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
