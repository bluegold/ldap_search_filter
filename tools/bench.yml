implementations:
  - name: ruby
    command:
      - ruby
      - ruby/ldap_filter.rb
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: typescript
    build: &typescript_build
      cwd: typescript
      command:
        - tsc
        - -p
        - tsconfig.json
    command:
      - node
      - typescript/dist/index.js
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: typescript-bun
    build: *typescript_build
    command:
      - bun
      - typescript/dist/index.js
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: csharp
    build:
      cwd: csharp
      command:
        - env
        - DOTNET_CLI_HOME=/tmp/ldf-dotnet
        - DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
        - DOTNET_NOLOGO=1
        - dotnet
        - build
        - -c
        - Release
    command:
      - env
      - DOTNET_CLI_HOME=/tmp/ldf-dotnet
      - DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
      - DOTNET_NOLOGO=1
      - dotnet
      - csharp/bin/Release/net10.0/LdapFilter.dll
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: zig
    build:
      cwd: zig
      command:
        - env
        - ZIG_GLOBAL_CACHE_DIR=/tmp/ldf-zig-cache
        - ZIG_LOCAL_CACHE_DIR=/tmp/ldf-zig-cache-local
        - zig
        - build
        - -Doptimize=ReleaseFast
    command:
      - env
      - ZIG_GLOBAL_CACHE_DIR=/tmp/ldf-zig-cache
      - ZIG_LOCAL_CACHE_DIR=/tmp/ldf-zig-cache-local
      - zig/zig-out/bin/ldap_filter
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
  - name: rust
    build:
      cwd: rust
      command:
        - cargo
        - build
        - --release
        - --locked
    command:
      - rust/target/release/ldf
      - "{jit_flag}"
      - --format
      - "{format}"
      - "{filter}"
      - "{input}"
